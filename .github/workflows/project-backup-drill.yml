name: Project backup fixture drill
on:
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/lib/project-backup-*.mjs"
      - ".github/workflows/project-backup-drill.yml"
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: khoonemoon_backup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Use PostgreSQL 17 tools from the isolated fixture container
        run: |
          mkdir -p "$RUNNER_TEMP/pg-tools"
          for tool in pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/pg-tools/$tool" <<'SH'
          #!/bin/sh
          exec docker exec -i -e PGHOST=127.0.0.1 -e PGPORT=5432 -e PGUSER -e PGPASSWORD -e PGDATABASE "$BACKUP_TEST_POSTGRES_CONTAINER" "$(basename "$0")" "$@"
          SH
            chmod 755 "$RUNNER_TEMP/pg-tools/$tool"
          done
          echo "$RUNNER_TEMP/pg-tools" >> "$GITHUB_PATH"
      - name: Capture and restore isolated fixture database and object
        env:
          BACKUP_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          PROJECT_BACKUP_TEST_DATABASE_URL: postgres://postgres:fixture@127.0.0.1:5432/khoonemoon_backup_test
        run: npx vitest run scripts/lib/project-backup-integration.test.mjs
