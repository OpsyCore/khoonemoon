name: Project backup fixture drill
on:
  push:
    branches: ["arena/**"]
    paths:
      - "scripts/lib/project-backup-*.mjs"
      - ".github/workflows/project-backup-drill.yml"
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: khoonemoon_backup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Ensure PostgreSQL 17 tools are available
        run: |
          if [ -x /usr/lib/postgresql/17/bin/pg_dump ]; then
            echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client-17
            echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
          fi
      - name: Capture and restore isolated fixture database and object
        env:
          PROJECT_BACKUP_TEST_DATABASE_URL: postgres://postgres:fixture@127.0.0.1:5432/khoonemoon_backup_test
        run: npx vitest run scripts/lib/project-backup-integration.test.mjs
