name: Transfer requested test APK
on:
  push:
    branches: [arena/00d965b0-khoonemoon]
    paths: [.github/workflows/transfer-test-apk-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    strategy:
      matrix:
        part: [0, 1, 2]
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare public test APK chunks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 41358694677 --name khoonemoon-test-apk --dir apk
          test -s apk/app-debug.apk
          sha256sum apk/app-debug.apk > apk.sha256
          gzip -n -9 -c apk/app-debug.apk | base64 -w0 | split -b 40000 -d -a 3 - part-
          echo "::notice title=APK-checksum::$(cat apk.sha256)"
          test "$(ls part-* | wc -l)" -le 144
      - name: Transfer test APK group 1
        env:
          PART: ${{ matrix.part }}
        run: |
          start=$((PART * 48 + 0))
          end=$((start + 7))
          for i in $(seq "$start" "$end"); do
            f=$(printf 'part-%03d' "$i")
            if [ -f "$f" ]; then printf '::notice title=APK-%03d::%s\n' "$i" "$(cat "$f")"; fi
          done
      - name: Transfer test APK group 2
        env:
          PART: ${{ matrix.part }}
        run: |
          start=$((PART * 48 + 8))
          end=$((start + 7))
          for i in $(seq "$start" "$end"); do
            f=$(printf 'part-%03d' "$i")
            if [ -f "$f" ]; then printf '::notice title=APK-%03d::%s\n' "$i" "$(cat "$f")"; fi
          done
      - name: Transfer test APK group 3
        env:
          PART: ${{ matrix.part }}
        run: |
          start=$((PART * 48 + 16))
          end=$((start + 7))
          for i in $(seq "$start" "$end"); do
            f=$(printf 'part-%03d' "$i")
            if [ -f "$f" ]; then printf '::notice title=APK-%03d::%s\n' "$i" "$(cat "$f")"; fi
          done
      - name: Transfer test APK group 4
        env:
          PART: ${{ matrix.part }}
        run: |
          start=$((PART * 48 + 24))
          end=$((start + 7))
          for i in $(seq "$start" "$end"); do
            f=$(printf 'part-%03d' "$i")
            if [ -f "$f" ]; then printf '::notice title=APK-%03d::%s\n' "$i" "$(cat "$f")"; fi
          done
      - name: Transfer test APK group 5
        env:
          PART: ${{ matrix.part }}
        run: |
          start=$((PART * 48 + 32))
          end=$((start + 7))
          for i in $(seq "$start" "$end"); do
            f=$(printf 'part-%03d' "$i")
            if [ -f "$f" ]; then printf '::notice title=APK-%03d::%s\n' "$i" "$(cat "$f")"; fi
          done
      - name: Transfer test APK group 6
        env:
          PART: ${{ matrix.part }}
        run: |
          start=$((PART * 48 + 40))
          end=$((start + 7))
          for i in $(seq "$start" "$end"); do
            f=$(printf 'part-%03d' "$i")
            if [ -f "$f" ]; then printf '::notice title=APK-%03d::%s\n' "$i" "$(cat "$f")"; fi
          done
