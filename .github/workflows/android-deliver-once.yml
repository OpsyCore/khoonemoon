name: Deliver requested test APK
on:
  push:
    branches: [arena/00d965b0-khoonemoon]
    paths: [.github/workflows/android-deliver-once.yml]
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download 41358694677 --name khoonemoon-test-apk --dir new
          test -s new/app-debug.apk
          sha256sum new/app-debug.apk
          echo "APK_SHA256=$(sha256sum new/app-debug.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Compare against previous test signature
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh run download 41203684965 --name khoonemoon-debug-apk --dir previous; then
            for apk in previous/*.apk new/*.apk; do
              echo "$apk"
              "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep 'certificate SHA-256 digest'
            done
          else
            echo 'Previous APK artifact unavailable for signature comparison.'
          fi
      - name: Publish direct test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp new/app-debug.apk khoonemoon-test.apk
          gh release create "android-test-${GITHUB_RUN_ID}" khoonemoon-test.apk \
            --target e95fc4be25486173807a4483faabb1ff80e79151 \
            --title "Android test APK ${GITHUB_RUN_ID}" --prerelease \
            --notes "Debug-signed test build, not a market release. SHA-256: ${APK_SHA256}."
