name: Android APK
on:
  workflow_dispatch:
  # A test APK is built only for an explicitly tagged commit on this session's branch.
  push:
    branches: ["arena/62660bb1-khoonemoon"]

permissions:
  contents: read
  actions: read

jobs:
  apk:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test-apk]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Wait for successful CI on this exact commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            state=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f "head_sha=$GITHUB_SHA" -f event=push \
              --jq '.workflow_runs[0] | if . then .status + ":" + (.conclusion // "") else "pending:" end')
            case "$state" in
              completed:success) echo "CI succeeded for $GITHUB_SHA"; exit 0 ;;
              completed:*) echo "CI did not succeed for $GITHUB_SHA: $state"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for CI on $GITHUB_SHA"; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build standalone app assets
        env:
          # These are public client values, protected by database RLS, not secrets.
          VITE_SUPABASE_URL: https://isfzuxrkzeeeggvfcoah.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_8K19EQ14TIUDZrVlDvIuyQ_0mVaEkjd
        run: |
          npm ci --legacy-peer-deps
          npm run mobile:build
          test -s dist/mobile/index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable test APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify test APK assets and signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'assets/index.html$'
          unzip -l "$APK" | grep -E 'assets/assets/index-.*\.js$'
          unzip -p "$APK" assets/index.html | grep -F 'Content-Security-Policy'
          node scripts/verify-android-assets.mjs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: khoonemoon-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare release signing (when configured)
        if: github.event_name == 'workflow_dispatch'
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/khoonemoon-release.jks"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Release signing not configured; only the test APK was produced.'
          fi
      - name: Build signed release APK
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/khoonemoon-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release signature
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
      - name: Upload signed release
        if: github.event_name == 'workflow_dispatch' && steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: khoonemoon-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/khoonemoon-release.jks"
