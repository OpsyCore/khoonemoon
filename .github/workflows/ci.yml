name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Migrations · RLS
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: khoonemoon_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Ensure psql is available
        run: |
          psql --version || (
            sudo apt-get update -qq &&
            sudo apt-get install -y -qq postgresql-client
          )

      - name: Apply migrations and run RLS assertions
        id: dbverify
        run: |
          set +e
          npm run db:verify 2>&1 | tee db-verify.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit "$exit_code"
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/khoonemoon_check

      # Surfaces the failing statement as a PR comment. Helpful because the
      # sandbox used during development cannot download raw workflow logs.
      - name: Report database failure
        if: failure() && github.event_name == 'pull_request'
        run: |
          {
            echo "### بررسی دیتابیس شکست خورد"
            echo ""
            echo '```'
            tail -60 db-verify.log 2>/dev/null || echo "no log captured"
            echo '```'
          } > db-failure.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file db-failure.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build must succeed without real credentials: the DB/env accessors are lazy
          # and the font is self-hosted, so no network calls are required.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
