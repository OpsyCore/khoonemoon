name: Backup connectivity check
on:
  push:
    branches: ["arena/00d965b0-khoonemoon"]
    paths: [".github/workflows/backup-network-check.yml"]
permissions: {}
jobs:
  pooler:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test IPv4 access to the Supabase session pooler (no credentials)
        run: |
          python3 - <<'PY'
          import socket
          host = 'aws-0-ap-southeast-2.pooler.supabase.com'
          addresses = socket.getaddrinfo(host, 5432, socket.AF_INET, socket.SOCK_STREAM)
          if not addresses:
              raise RuntimeError('No IPv4 endpoint')
          with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as connection:
              connection.settimeout(10)
              connection.connect(addresses[0][4])
          print('IPv4 TCP connection to session pooler succeeded')
          PY
